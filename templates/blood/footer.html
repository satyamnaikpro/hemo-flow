<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .hemo-footer {
      background: #1d2d44;
      color: #e0e1dd;
      padding: 30px 0 20px;
      margin-top: 60px;
      border-top: 3px solid #d90429;
    }
    .hemo-footer a {
      color: #fca311;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .hemo-footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
    .hemo-footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
      padding-top: 15px;
      font-size: 13px;
      color: #8d99ae;
      text-align: center;
    }
  </style>
</head>
<body>
  <footer class="hemo-footer">
    <div class="container text-center">
      <h5 style="color: #ffffff; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;">
        <i class="fas fa-heartbeat" style="color: #ef233c;"></i> Hemo Flow
      </h5>
      <p style="font-size: 14px; margin: 8px auto 14px; max-width: 500px; color: #adb5bd;">
        A reliable, real-time blood bank and donation management platform connecting donors, patients, and healthcare providers.
      </p>
      <div style="font-size: 14px; margin-bottom: 10px;">
        <a href="/">Home</a> &bull;
        <a href="/patient/patientlogin">Patient Login</a> &bull;
        <a href="/donor/donorlogin">Donor Login</a> &bull;
        <a href="/adminlogin">Admin Portal</a>
      </div>
      <div class="hemo-footer-bottom">
        <span>Hemo Flow &mdash; Every Drop Connects a Life.</span>
      </div>
    </div>
  </footer>
</body>
</html>
