<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal - Hemo Flow</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #2b2d42;
    }
    .hemo-patient-nav {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2);
      padding: 10px 24px;
      z-index: 1030;
    }
    .hemo-patient-nav .navbar-brand {
      color: #ffffff !important;
      font-size: 20px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .hemo-patient-nav .navbar-brand i {
      color: #ffffff;
      font-size: 22px;
    }
    .portal-badge {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .logout-btn {
      color: #ffffff !important;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .logout-btn:hover {
      background: rgba(0, 0, 0, 0.4);
      transform: translateY(-1px);
    }

    /* Layout */
    .wrapper {
      display: flex;
      margin-top: 60px;
      min-height: calc(100vh - 60px);
    }
    .sidebar {
      width: 240px;
      background: #1d2d44;
      position: fixed;
      top: 60px;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      padding: 20px 0;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
      z-index: 1020;
    }
    .sidebar-header {
      padding: 0 20px 15px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8d99ae;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .sidebar ul {
      list-style: none;
      padding: 10px 0 0;
      margin: 0;
    }
    .sidebar ul li a {
      color: #adb5bd;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
    }
    .sidebar ul li a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border-left-color: #38bdf8;
    }
    .sidebar ul li a i {
      width: 20px;
      font-size: 16px;
      color: #8d99ae;
      transition: color 0.2s ease;
    }
    .sidebar ul li a:hover i {
      color: #38bdf8;
    }
    .main_content {
      margin-left: 240px;
      padding: 30px;
      width: calc(100% - 240px);
      flex: 1;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 70px;
      }
      .sidebar-header, .sidebar ul li a span {
        display: none;
      }
      .sidebar ul li a {
        padding: 15px;
        justify-content: center;
      }
      .sidebar ul li a i {
        font-size: 20px;
      }
      .main_content {
        margin-left: 70px;
        width: calc(100% - 70px);
        padding: 15px;
      }
    }

    /* Common Card Styling for Dashboards */
    .card {
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .card.bg-light {
      background: #ffffff !important;
    }
    .blood i {
      font-size: 26px;
    }
    .xyz {
      color: #0284c7 !important;
    }
  </style>
</head>
<body>

  <nav class="navbar fixed-top hemo-patient-nav d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="/patient/patient-dashboard">
      <i class="fas fa-procedures"></i>
      <span>Hemo Flow</span>
      <span class="portal-badge">Patient</span>
    </a>

    <div>
      <a class="logout-btn" href="/logout">
        <i class="fas fa-sign-out-alt"></i>
        <span>Logout</span>
      </a>
    </div>
  </nav>

  <div class="wrapper">
    <div class="sidebar">
      <div class="sidebar-header">Patient Menu</div>
      <ul>
        <li><a href="/patient/patient-dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
        <li><a href="/patient/make-request"><i class="fas fa-sync-alt"></i> <span>Make Request</span></a></li>
        <li><a href="/patient/my-request"><i class="fas fa-history"></i> <span>Request History</span></a></li>
      </ul>
    </div>

    <div class="main_content">
      {% block content %}
      {% endblock content %}
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
